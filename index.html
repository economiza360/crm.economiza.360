<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso ao Sistema</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    background-color: #0a1f44;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    background-color: #ffffff;
    width: 350px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    overflow: hidden;
  }

  .header {
    background-color: #0a1f44;
    color: #ffffff;
    text-align: center;
    padding: 20px;
  }

  .header h1 {
    font-size: 22px;
  }
 .tabs {
    display: flex;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 12px;
    cursor: pointer;
    background-color: #e6e9f0;
    color: #0a1f44;
    font-weight: bold;
    border-bottom: 3px solid transparent;
    transition: 0.3s;
  }

  .tab.active {
    background-color: #ffffff;
    border-bottom: 3px solid #0a1f44;
  }

  .form-box {
    padding: 25px;
  }

  .form-box.hidden {
    display: none;
  }

  label {
    display: block;
    margin-bottom: 6px;
    color: #0a1f44;
    font-weight: bold;
    font-size: 14px;
  }

  input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }

  button {
    width: 100%;
    padding: 12px;
    background-color: #0a1f44;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background-color: #14305e;
  }

  .msg {
    text-align: center;
    margin-top: 10px;
    font-size: 13px;
    color: red;
  }

  .msg.success {
    color: green;
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>Bem-vindo</h1>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabLogin" onclick="mostrarLogin()">Login</div>
    <div class="tab" id="tabCadastro" onclick="mostrarCadastro()">Cadastro</div>
  </div>
 <div class="form-box" id="formLogin">
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="Digite seu email">

    <label>Senha</label>
    <input type="password" id="loginSenha" placeholder="Digite sua senha">

    <button onclick="fazerLogin()">Entrar</button>

    <div class="msg" id="msgLogin"></div>
  </div>
  <div class="form-box hidden" id="formCadastro">
    <label>Email</label>
    <input type="email" id="cadastroEmail" placeholder="Digite seu email">

    <label>Senha</label>
    <input type="password" id="cadastroSenha" placeholder="Crie uma senha">

    <button onclick="fazerCadastro()">Cadastrar</button>

    <div class="msg" id="msgCadastro"></div>
  </div>

</div>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
  // Configuração do Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyC1oZ9sky9XLaLbkztPuugEYY1bB1kTlyg",
    authDomain: "crm-ez360.firebaseapp.com",
    projectId: "crm-ez360",
    storageBucket: "crm-ez360.firebasestorage.app",
    messagingSenderId: "271199893828",
    appId: "1:271199893828:web:5d3f4f2b0b0903820fff11"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  // Trocar entre abas
  function mostrarLogin() {
    document.getElementById('formLogin').classList.remove('hidden');
    document.getElementById('formCadastro').classList.add('hidden');
    document.getElementById('tabLogin').classList.add('active');
    document.getElementById('tabCadastro').classList.remove('active');
  }

  function mostrarCadastro() {
    document.getElementById('formCadastro').classList.remove('hidden');
    document.getElementById('formLogin').classList.add('hidden');
    document.getElementById('tabCadastro').classList.add('active');
    document.getElementById('tabLogin').classList.remove('active');
  }

  // Cadastro
  function fazerCadastro() {
    const email = document.getElementById('cadastroEmail').value;
    const senha = document.getElementById('cadastroSenha').value;
    const msg = document.getElementById('msgCadastro');

    auth.createUserWithEmailAndPassword(email, senha)
      .then(() => {
        msg.textContent = "Cadastro realizado com sucesso!";
        msg.classList.add('success');
        setTimeout(() => mostrarLogin(), 1500);
      })
      .catch((error) => {
        msg.classList.remove('success');
        msg.textContent = "Erro: " + error.message;
      });
  }

  // Login
  function fazerLogin() {
    const email = document.getElementById('loginEmail').value;
    const senha = document.getElementById('loginSenha').value;
    const msg = document.getElementById('msgLogin');

    auth.signInWithEmailAndPassword(email, senha)
      .then((cred) => {
        msg.classList.add('success');
        msg.textContent = "Login realizado com sucesso!";
        entrarNoSistema(cred.user);
      })
      .catch((error) => {
        msg.classList.remove('success');
        msg.textContent = "Erro: " + error.message;
      });
  }
</script>

  .kanbanCard.yellow { border-left-color:#f9a825; } .kanbanCard.red { border-left-color:#e53935; }

<script>
let db2;
try { db2 = firebase.firestore(); } catch(e) { console.error('Firestore não inicializado:', e); }

let usuarioAtual = null;
let listaLeads = [];
let listaUsuarios = [];

const ETAPAS = [
  { key:'novo_lead', label:'Novo Lead' },
  { key:'qualificacao', label:'Qualificação' },
  { key:'reuniao_agendada', label:'Reunião Agendada' },
  { key:'negociacao', label:'Negociação' },
  { key:'ganho', label:'Ganho' },
  { key:'perdido', label:'Perdido' },
];

function etapaLabel(k) { const e = ETAPAS.find(x=>x.key===k); return e ? e.label : k; }

function fmtMoney(v) {
  return (Number(v)||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}

async function entrarNoSistema(user) {
  try {
    let doc = await db2.collection('users').doc(user.uid).get();

    if (!doc.exists) {
      await db2.collection('users').doc(user.uid).set({
        nome: user.email.split('@')[0],
        email: user.email,
        role: 'admin',
        ativo: true,
        criadoEm: firebase.firestore.FieldValue.serverTimestamp()
      });
      doc = await db2.collection('users').doc(user.uid).get();
    }

    const dados = doc.data();
    if (!dados.ativo) {
      alert('Seu acesso foi desativado.');
      auth.signOut();
      return;
    }

    usuarioAtual = { uid:user.uid, nome:dados.nome, email:dados.email, role:dados.role };

    document.getElementById('topoNome').textContent = usuarioAtual.nome;
    document.getElementById('topoRole').textContent =
      usuarioAtual.role === 'admin' ? 'Administrador' : usuarioAtual.role === 'gestor' ? 'Gestor' : 'Vendedor';

    montarMenu();
    document.getElementById('appShell').style.display = 'flex';

    mostrarPagina('dashboard');
    await carregarLeads();
    await carregarUsuarios();
  } catch (err) {
    console.error(err);
    alert('Erro ao entrar no sistema: ' + err.message);
  }
}

function sairSistema() {
  auth.signOut().then(() => {
    document.getElementById('appShell').style.display = 'none';
    location.reload();
  });
}

function montarMenu() {
  const nav = document.getElementById('menuNav');
  let itens = [
    { id:'dashboard', label:'Dashboard' },
    { id:'pipeline', label:'Pipeline' },
    { id:'leads', label:'Leads' },
  ];
  if (usuarioAtual.role === 'admin') itens.push({ id:'usuarios', label:'Usuários' });

  nav.innerHTML = '';
  itens.forEach(it => {
    const a = document.createElement('a');
    a.className = 'menu-item';
    a.textContent = it.label;
    a.onclick = () => mostrarPagina(it.id);
    a.id = 'menu-' + it.id;
    nav.appendChild(a);
  });
}

function mostrarPagina(id) {
  document.querySelectorAll('.pageView').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
  const m = document.getElementById('menu-' + id);
  if (m) m.classList.add('active');

  if (id === 'dashboard') renderDashboard();
  if (id === 'pipeline') renderPipeline();
}

async function carregarLeads() {
  try {
    let query = db2.collection('leads');
    if (usuarioAtual.role === 'vendedor') query = query.where('responsavelId','==', usuarioAtual.uid);
    const snap = await query.get();
    listaLeads = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    renderLeadsTable();
  } catch (e) { console.error(e); }
}

function renderLeadsTable() {
  const termo = (document.getElementById('buscaLead').value || '').toLowerCase();
  const tbody = document.getElementById('tabelaLeadsBody');
  tbody.innerHTML = '';
  listaLeads
    .filter(l => !termo || (l.nome||'').toLowerCase().includes(termo))
    .forEach(l => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${l.nome||''}</td>
        <td>${l.empresa||'--'}</td>
        <td><span class="badge2 blue">${etapaLabel(l.etapa)}</span></td>
        <td>${l.responsavelNome||'--'}</td>
        <td>${fmtMoney(l.valorPotencial)}</td>
        <td><button class="btn2 small secondary" onclick="mudarEtapaRapida('${l.id}')">Mudar etapa</button></td>
      `;
      tbody.appendChild(tr);
    });
  if (!tbody.innerHTML) tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888;padding:20px;">Nenhum lead.</td></tr>';
}

function abrirModalLead() {
  document.getElementById('lNome').value = '';
  document.getElementById('lEmpresa').value = '';
  document.getElementById('lTelefone').value = '';
  document.getElementById('lValor').value = '';
  document.getElementById('lEtapa').value = 'novo_lead';
  document.getElementById('msgLead').textContent = '';
  document.getElementById('modalLead').classList.add('open');
}

function fecharModal(id) { document.getElementById(id).classList.remove('open'); }

async function salvarLead() {
  const nome = document.getElementById('lNome').value.trim();
  const msg = document.getElementById('msgLead');
  if (!nome) { msg.textContent = 'Informe o nome.'; return; }

  const dados = {
    nome,
    empresa: document.getElementById('lEmpresa').value.trim(),
    telefone: document.getElementById('lTelefone').value.trim(),
    valorPotencial: Number(document.getElementById('lValor').value) || 0,
    etapa: document.getElementById('lEtapa').value,
    status: 'ativo',
    responsavelId: usuarioAtual.uid,
    responsavelNome: usuarioAtual.nome,
    criadoEm: firebase.firestore.FieldValue.serverTimestamp()
  };

  try {
    await db2.collection('leads').add(dados);
    fecharModal('modalLead');
    await carregarLeads();
  } catch (e) { msg.textContent = 'Erro: ' + e.message; }
}

async function mudarEtapaRapida(id) {
  const nova = prompt('Nova etapa (novo_lead, qualificacao, reuniao_agendada, negociacao, ganho, perdido):');
  if (!nova) return;
  try {
    await db2.collection('leads').doc(id).update({ etapa: nova });
    await carregarLeads();
  } catch (e) { alert('Erro: ' + e.message); }
}

function renderPipeline() {
  const board = document.getElementById('kanbanBoard');
  board.innerHTML = '';
  ETAPAS.forEach(et => {
    const leadsDaEtapa = listaLeads.filter(l => l.etapa === et.key);
    const col = document.createElement('div');
    col.className = 'kanbanCol';
    col.dataset.etapa = et.key;
    col.innerHTML = `<h3>${et.label} (${leadsDaEtapa.length})</h3>`;
    leadsDaEtapa.forEach(l => {
      const card = document.createElement('div');
      card.className = 'kanbanCard';
      card.draggable = true;
      card.dataset.id = l.id;
      card.innerHTML = `<strong>${l.nome}</strong>${l.empresa||''} - ${fmtMoney(l.valorPotencial)}`;
      card.addEventListener('dragstart', () => card.classList.add('dragging'));
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      col.appendChild(card);
    });
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', () => col.classList.remove('dragover'));
    col.addEventListener('drop', async (e) => {
      e.preventDefault();
      col.classList.remove('dragover');
      const dragging = document.querySelector('.kanbanCard.dragging');
      if (!dragging) return;
      const leadId = dragging.dataset.id;
      const novaEtapa = col.dataset.etapa;
      try {
        await db2.collection('leads').doc(leadId).update({ etapa: novaEtapa });
        await carregarLeads();
        renderPipeline();
      } catch (err) { alert('Erro: ' + err.message); }
    });
    board.appendChild(col);
  });
}

function renderDashboard() {
  const total = listaLeads.length;
  const ganhos = listaLeads.filter(l => l.etapa === 'ganho').length;
  const perdidos = listaLeads.filter(l => l.etapa === 'perdido').length;
  const valorTotal = listaLeads.reduce((s,l) => s + (Number(l.valorPotencial)||0), 0);

  document.getElementById('dashCards').innerHTML = `
    <div style="background:#fff;border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);">
      <div style="font-size:12px;color:#888;">TOTAL DE LEADS</div>
      <div style="font-size:24px;color:#0a1f44;font-weight:bold;">${total}</div>
    </div>
    <div style="background:#fff;border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);">
      <div style="font-size:12px;color:#888;">GANHOS</div>
      <div style="font-size:24px;color:#2e7d32;font-weight:bold;">${ganhos}</div>
    </div>
    <div style="background:#fff;border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);">
      <div style="font-size:12px;color:#888;">PERDIDOS</div>
      <div style="font-size:24px;color:#e53935;font-weight:bold;">${perdidos}</div>
    </div>
    <div style="background:#fff;border-radius:10px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);">
      <div style="font-size:12px;color:#888;">VALOR EM CARTEIRA</div>
      <div style="font-size:24px;color:#0a1f44;font-weight:bold;">${fmtMoney(valorTotal)}</div>
    </div>
  `;
}

async function carregarUsuarios() {
  if (usuarioAtual.role !== 'admin') return;
  try {
    const snap = await db2.collection('users').get();
    listaUsuarios = snap.docs.map(d => ({ uid:d.id, ...d.data() }));
    renderUsersTable();
  } catch (e) { console.error(e); }
}

function renderUsersTable() {
  const termo = (document.getElementById('buscaUser').value || '').toLowerCase();
  const tbody = document.getElementById('tabelaUsersBody');
  tbody.innerHTML = '';
  listaUsuarios
    .filter(u => !termo || (u.nome||'').toLowerCase().includes(termo))
    .forEach(u => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${u.nome||''}</td>
        <td>${u.email||''}</td>
        <td>${u.role}</td>
        <td><span class="badge2 ${u.ativo?'green':'red'}">${u.ativo?'Ativo':'Inativo'}</span></td>
        <td><button class="btn2 small secondary" onclick="toggleAtivoUser('${u.uid}', ${!u.ativo})">${u.ativo?'Desativar':'Ativar'}</button></td>
      `;
      tbody.appendChild(tr);
    });
}

function abrirModalUser() {
  document.getElementById('uNome').value = '';
  document.getElementById('uEmail').value = '';
  document.getElementById('uSenha').value = '';
  document.getElementById('uRole').value = 'vendedor';
  document.getElementById('msgUser').textContent = '';
  document.getElementById('modalUser').classList.add('open');
}

async function criarUsuario() {
  const nome = document.getElementById('uNome').value.trim();
  const email = document.getElementById('uEmail').value.trim();
  const senha = document.getElementById('uSenha').value;
  const role = document.getElementById('uRole').value;
  const msg = document.getElementById('msgUser');

  if (!nome || !email || senha.length < 6) {
    msg.textContent = 'Preencha tudo (senha mínimo 6 caracteres).';
    return;
  }

  const firebaseConfigAtual = firebase.app().options;
  const secondaryApp = firebase.initializeApp(firebaseConfigAtual, 'Secondary-' + Date.now());

  try {
    const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, senha);
    await db2.collection('users').doc(cred.user.uid).set({
      nome, email, role, ativo: true,
      criadoEm: firebase.firestore.FieldValue.serverTimestamp()
    });
    await secondaryApp.auth().signOut();
    await secondaryApp.delete();
    fecharModal('modalUser');
    await carregarUsuarios();
  } catch (e) {
    msg.textContent = 'Erro: ' + e.message;
    try { await secondaryApp.delete(); } catch(_) {}
  }
}

async function toggleAtivoUser(uid, novoStatus) {
  try {
    await db2.collection('users').doc(uid).update({ ativo: novoStatus });
    await carregarUsuarios();
  } catch (e) { alert('Erro: ' + e.message); }
}
</script>
